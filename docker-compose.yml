services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voxflow}
      POSTGRES_USER: ${POSTGRES_USER:-voxflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - voxflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxflow} -d ${POSTGRES_DB:-voxflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxflow}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-voxflow}
      CORS_ORIGINS: http://localhost:5173
      MODEL_SIZE: ${MODEL_SIZE:-base}
      DEVICE: ${DEVICE:-cpu}
      COMPUTE_TYPE: ${COMPUTE_TYPE:-int8}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      ENABLE_LANGUAGE_DETECTION: ${ENABLE_LANGUAGE_DETECTION:-true}
      AUDIO_WINDOW_SECONDS: ${AUDIO_WINDOW_SECONDS:-3}
      AUDIO_OVERLAP_SECONDS: ${AUDIO_OVERLAP_SECONDS:-0.75}
      WEBSOCKET_MAX_CHUNK_BYTES: ${WEBSOCKET_MAX_CHUNK_BYTES:-262144}
      WEBSOCKET_MAX_SESSION_SECONDS: ${WEBSOCKET_MAX_SESSION_SECONDS:-3600}
      WEBSOCKET_IDLE_TIMEOUT_SECONDS: ${WEBSOCKET_IDLE_TIMEOUT_SECONDS:-60}
      WEBSOCKET_START_TIMEOUT_SECONDS: ${WEBSOCKET_START_TIMEOUT_SECONDS:-15}
      AUDIO_STORAGE_DIR: /app/var/audio
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - voxflow-audio:/app/var/audio
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/ws/transcription
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  voxflow-postgres:
  voxflow-audio:
